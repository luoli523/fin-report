name: Daily Finance Briefing

on:
  # 新加坡时间 09:30 = UTC 01:30，周二到周六（美股周一到周五收盘后）
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Create .env file
        run: |
          cat << 'ENVEOF' > .env
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY=${{ secrets.XAI_API_KEY }}
          LLM_STEP_TRIAGE=${{ secrets.LLM_STEP_TRIAGE }}
          LLM_STEP_SYNTHESIS=${{ secrets.LLM_STEP_SYNTHESIS }}
          LLM_STEP_WATCHLIST=${{ secrets.LLM_STEP_WATCHLIST }}
          LLM_STEP_PORTFOLIO=${{ secrets.LLM_STEP_PORTFOLIO }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          HOLDINGS_JSON=${{ secrets.HOLDINGS_JSON }}
          EMAIL_ENABLED=${{ secrets.EMAIL_ENABLED }}
          EMAIL_TO=${{ secrets.EMAIL_TO }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT=${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS=${{ secrets.EMAIL_SMTP_PASS }}
          TELEGRAM_ENABLED=${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

      # 私人记忆不进公开仓库，用 cache 跨天持久化
      - name: Restore private memory
        uses: actions/cache/restore@v4
        with:
          path: data/memory/private.json
          key: v2-private-memory-${{ github.run_id }}
          restore-keys: |
            v2-private-memory-

      - name: Run v2 pipeline
        run: npm run v2
        timeout-minutes: 25

      - name: Save private memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/memory/private.json
          key: v2-private-memory-${{ github.run_id }}

      - name: Send email
        run: npm run send-email
        continue-on-error: true

      - name: Send Telegram
        run: npm run send-telegram
        continue-on-error: true

      # --- Website ---
      - name: Prepare website content
        run: |
          DATE=$(date -u +%Y-%m-%d)
          bash scripts/prepare-website-content.sh "$DATE" ./output ./website

      - name: Commit website content, world history and public memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/content/reports/ website/public/briefings/ data/history/world/ data/memory/public.json
          git diff --cached --quiet || git commit -m "chore: add briefing $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push failed (non-critical)"
        continue-on-error: true

      - name: Build website
        run: |
          cd website
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist

      # 叫醒 Grok Bot 按 BOT_INTEGRATION.md 生信息图并回传 PNG。
      # Secrets 未配置时跳过，不影响 daily 本身。
      - name: Notify Grok Bot (infographic)
        env:
          WEBHOOK_URL: ${{ secrets.GROK_BOT_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_BOT_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "GROK_BOT_WEBHOOK_URL/KEY not set — skip bot notify"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BODY=$(DATE="$DATE" python3 -c 'import json,os; d=os.environ["DATE"]; print(json.dumps({"source":"daily-briefing","date":d,"latest_json":"https://luoli523.github.io/fin-report/briefings/latest.json","brief_md":f"https://luoli523.github.io/fin-report/briefings/{d}/brief.md","public_md":f"https://luoli523.github.io/fin-report/briefings/{d}/public.md","infographic_upload_path":f"website/public/images/infographics/{d}.png"},ensure_ascii=False))')
          echo "POSTing infographic wake for $DATE"
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo ""
          echo "Webhook accepted (bot run is async)"
        continue-on-error: true

      # 私人简报不进 artifact
      - name: Upload public outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: |
            output/
            !output/v2-private-*
          retention-days: 30

      - name: Summary
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "## Daily Briefing $DATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/v2-public-$DATE.md ]; then
            echo '```markdown' >> $GITHUB_STEP_SUMMARY
            head -40 output/v2-public-$DATE.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
